<header><span class="mark" aria-hidden="true">✦</span><div><h1>X Learning Feed</h1><p data-i18n="panel.tagline"></p></div></header>
<section><form id="settings">
  <label class="row"><span data-i18n="panel.language"></span><select id="language"><option value="auto" data-i18n="panel.language.auto"></option><option value="zh" lang="zh-CN">中文</option><option value="en" lang="en">English</option></select></label>
  <label class="row"><span data-i18n="panel.enabled"></span><input id="enabled" type="checkbox" role="switch"></label>
  <label class="row"><span data-i18n="panel.every"></span><span><span data-i18n="panel.every.before"></span> <input id="every" type="number" min="1" max="100" value="10" required data-i18n-aria-label="panel.every.aria"> <span data-i18n="panel.every.after"></span></span></label>
  <div class="row"><span id="mode-label" data-i18n="panel.mode"></span><span class="segmented" role="radiogroup" aria-labelledby="mode-label" aria-describedby="mode-hint"><label><input type="radio" name="mode" value="learn"><span data-i18n="panel.mode.learn"></span></label><label><input type="radio" name="mode" value="browse" checked><span data-i18n="panel.mode.browse"></span></label></span></div>
  <p id="mode-hint" class="hint" data-i18n="panel.mode.hint"></p>
  <label class="row"><span data-i18n="panel.timeWeight"></span><input id="time-weight" type="checkbox" role="switch" checked aria-describedby="time-hint"></label>
  <p id="time-hint" class="hint" data-i18n="panel.timeWeight.hint"></p>
  <label class="row"><span data-i18n="panel.tagMode"></span><input id="tag-mode" type="checkbox" role="switch"></label>
  <label class="tag-field" for="tags"><span data-i18n="panel.tags"></span><input id="tags" type="text" value="x-feed" data-i18n-placeholder="panel.tags.placeholder" maxlength="2020" required disabled aria-describedby="tag-hint"></label>
  <p id="tag-hint" class="hint" data-i18n="panel.tags.hint"></p>
</form></section>
<section><div class="section-title"><h2 data-i18n="panel.fromObsidian"></h2><span id="note-count" class="badge">—</span></div>
  <p id="selection-info" class="hint" data-i18n="panel.select.default"></p><ul id="notes"></ul>
</section>
<section id="issues" hidden><h2 data-i18n="panel.issues"></h2><p class="hint" data-i18n="panel.issues.hint"></p><ul id="pending"></ul></section>
<footer><p id="sync-info" role="status" data-i18n="panel.loading"></p><p class="hint" data-i18n="panel.saveHint"></p>
<details id="connection"><summary data-i18n="panel.connection"></summary><form id="bridge">
  <label><span data-i18n="panel.port"></span><input id="port" type="number" min="1" max="65535" value="43127" required></label>
  <label><span data-i18n="panel.token"></span><input id="token" type="password" autocomplete="off" pattern="[a-f0-9]{64}" required></label>
  <p class="hint" data-i18n="panel.token.hint"></p>
  <div class="buttons"><button type="submit" data-i18n="panel.connect"></button><button id="disconnect" type="button" class="secondary" data-i18n="panel.disconnect"></button></div>
</form></details><p id="status" role="status" aria-live="polite"></p></footer>
